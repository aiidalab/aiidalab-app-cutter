---
services:

    aiidalab:
        image: ghcr.io/aiidalab/full-stack:${TAG:-latest}
        environment:
            RMQHOST: messaging
            SETUP_DEFAULT_AIIDA_PROFILE: 'true'
            AIIDALAB_DEFAULT_APPS: ''
            JUPYTER_TOKEN: ${JUPYTER_TOKEN}
        volumes:
            - ..:/home/jovyan/apps/{{cookiecutter.repo_name}}
        ports:
            - 8998:8888
