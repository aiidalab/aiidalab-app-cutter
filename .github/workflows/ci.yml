---
name: CI

on:
    push:
        branches:
            - main
    pull_request:

env:
    FORCE_COLOR: "1"

jobs:

    test-cookiecutter:

        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            matrix:
                python-version: ['3.10', '3.15']
            fail-fast: false


        steps:

            - uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.3.0
              with:
                  python-version: ${{ matrix.python-version }}
                  activate-environment: true

            - name: Run cookiecutter
              run: uvx cookiecutter --no-input .

            - name: Run pre-commit hooks on generated app
              run: |
                # Need to do this, pre-commit/prek otherwise skips untracked files
                cd aiidalab-my-app && git add -A && cd ..
                uvx prek run --all-files --show-diff-on-failure

            - name: Parse app metadata
              run: |
                uvx aiidalab registry parse-app-repo aiidalab-my-app/ > app_metadata.json
                diff app_metadata.json .github/app_metadata_reference.json
