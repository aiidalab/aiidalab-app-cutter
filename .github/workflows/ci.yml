---
name: CI

on:
    push:
        branches:
            - main
    pull_request:

env:
    FORCE_COLOR: "1"

jobs:

    test-cookiecutter:

        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            matrix:
                python-version: ['3.12', '3.15']
            fail-fast: false


        steps:

            - uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.3.2
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Run cookiecutter
              run: uvx cookiecutter --no-input .

            - name: Run pre-commit hooks on generated app
              run: |
                # Need to do this, pre-commit/prek otherwise skips untracked files
                cd aiidalab-my-app && git add -A && cd ..
                uvx prek run --all-files --show-diff-on-failure

            - name: Run unit tests
              run: cd aiidalab-my-app && uv run pytest tests/

            - name: Parse app metadata
              run: |
                uvx aiidalab@git+https://github.com/aiidalab/aiidalab registry parse-app-repo aiidalab-my-app/ > app_metadata.json
                diff app_metadata.json .github/app_metadata_reference.json


    test-notebooks:

        strategy:
            matrix:
                browser: [Chrome, Firefox]
                docker-tag: [edge]
            fail-fast: false

        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:

            - name: Check out app
              uses: actions/checkout@v7

            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: '3.12'

            - name: Run cookiecutter
              run: uvx cookiecutter --no-input .

            - name: Set jupyter token env
              run: echo "JUPYTER_TOKEN=$(openssl rand -hex 32)" >> $GITHUB_ENV

            - name: Run notebook tests
              run: cd aiidalab-my-app && uv run pytest -v --driver ${{ matrix.browser }} tests_notebooks/
              env:
                  TAG: ${{ matrix.docker-tag }}

            - name: Upload screenshots as artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: Screenshots-${{ matrix.docker-tag }}-${{ matrix.browser }}
                  path: aiidalab-my-app/screenshots/
                  if-no-files-found: error
